name: Daily Alert

on:
  workflow_dispatch:
  schedule:
    # 元データ（nikkei-data-auto）の更新後に判定する。
    # 03:00 JST（前日の18:00 UTC）、平日のみ。
    # JSTの月〜金はUTCの前日（日〜木）に相当する。
    - cron: "0 18 * * 0-4"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run Python
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
          SETTINGS_CSV_URL: ${{ secrets.SETTINGS_CSV_URL }}
          STATE_CSV_URL: ${{ secrets.STATE_CSV_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt ${attempt}/3"
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 60
            fi
          done
          exit 1
