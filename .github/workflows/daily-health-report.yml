name: Daily System Health Report

on:
  workflow_dispatch:
  schedule:
    # 毎日 09:15 JST（UTC 00:15）
    - cron: "15 0 * * *"

permissions:
  actions: read
  contents: read

jobs:
  health-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install health report dependencies
        run: python -m pip install requests

      - name: Run unit tests
        run: python -m unittest tests.test_daily_health_report -v

      - name: Notify LINE if health check tests fail
        if: failure()
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
        run: |
          python -c "import daily_health_report as h; h.send_line('【7システム毎日健康診断】\n診断プログラムのテストが失敗しました。GitHub Actionsを確認してください。')"

      - name: Check systems and notify LINE
        env:
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.HEALTH_GITHUB_TOKEN }}
          AUTO_REPAIR: "true"
          REPAIR_POLL_ATTEMPTS: "8"
          REPAIR_WAIT_SECONDS: "15"
        run: python daily_health_report.py
